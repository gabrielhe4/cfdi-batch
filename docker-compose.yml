services:
  postgres:
    image: postgres:16
    container_name: cfdi-batch-db
    environment:
      POSTGRES_DB: cfdi
      POSTGRES_USER: cfdi
      POSTGRES_PASSWORD: cfdi
    ports:
      - "5432:5432"
    volumes:
      - cfdi-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfdi -d cfdi"]
      interval: 5s
      retries: 10

volumes:
  cfdi-data:
